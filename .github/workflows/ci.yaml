name: Build & Publish OCI Image

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - master
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/rocketguedes/hytale-server

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  verify:
    name: Smoke Test & Manifest Validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local image for smoke testing
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: hytale-server:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run rootless & runtime smoke checks
        run: |
          test "$(docker run --rm --entrypoint id hytale-server:test -u)" = "1000"
          test "$(docker run --rm --entrypoint id hytale-server:test -g)" = "1000"
          docker run --rm --read-only --tmpfs /tmp --entrypoint java hytale-server:test -version
          docker run --rm --read-only --tmpfs /tmp --entrypoint jq hytale-server:test --version
          ! docker run --rm --read-only --tmpfs /tmp --entrypoint /healthcheck.sh hytale-server:test

      - name: Validate Kubernetes manifests (Kustomize)
        run: |
          if [ -d "k8s" ]; then
            kubectl kustomize k8s/ >/dev/null
          fi

  publish:
    name: Build & Push Multi-Arch OCI Image
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract OCI metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=Hytale Dedicated Server
            org.opencontainers.image.description=Cloud-native, rootless, multi-arch container image for Hytale Dedicated Server
            org.opencontainers.image.vendor=rocketguedes
            org.opencontainers.image.licenses=MIT

      - name: Build and push multi-arch image (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            IMAGE_VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
